apiVersion: apps/v1
kind: Deployment
metadata:
  name: almacenar
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: almacenar
  template:
    metadata:
      labels:
        app: almacenar
    spec:
      containers:
      - name: almacenar
        image: <tu-usuario>/almacenar:latest
        env:
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_HOST
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mysql-config
              key: MYSQL_DATABASE
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: almacenar
  namespace: microservicios
spec:
  selector:
    app: almacenar
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP