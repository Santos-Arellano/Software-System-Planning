apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  namespace: microservicios
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/mysql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: microservicios
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi