services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: hospital-microservices-keycloak-1
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=admin
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - JAVA_OPTS=-Xms256m -Xmx512m
      - KC_HTTP_ENABLED=true
    command:
    - start
    - --http-port=8080
    - --http-management-port=9000
    - --hostname-strict=false
    - --hostname=localhost
    - --db-url=jdbc:postgresql://postgres:5432/keycloak
    - --db-username=admin
    - --db-password=admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/hospital/.well-known/openid-configuration"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: keycloak
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak-config:
    image: curlimages/curl:latest
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak:/config
    command: >
      sh -c '
        for i in {1..5}; do
          echo "Attempt $$i: Waiting for Keycloak..."
          sleep 30
          ACCESS_TOKEN=$$(curl -s -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" "http://keycloak:8080/realms/master/protocol/openid-connect/token" | jq -r ".access_token")
          if [ "$$ACCESS_TOKEN" != "null" ] && [ "$$ACCESS_TOKEN" != "" ]; then
            curl -s -X POST http://keycloak:8080/admin/realms \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $$ACCESS_TOKEN" \
              -d @/config/realm.json && echo "Realm created successfully" && exit 0
          fi
          echo "Failed to get access token, retrying..."
        done
        echo "Failed to create realm after 5 attempts"
        exit 1
      '
    networks:
      - hospital-net
    restart: on-failure

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      mem_limit: 1536m
      mem_reservation: 1024m
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      mem_limit: 1536m
      mem_reservation: 1024m

    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  apigateway:
    build: ./api-gateway
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_CLIENT_ID=hospital-client
      - SPRING_CLOUD_LOADBALANCER_RETRY_ENABLED=true
      - SPRING_CLOUD_LOADBALANCER_RETRY_MAX_RETRIES=5
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_INITIAL_INTERVAL=1000
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_MAX_INTERVAL=5000
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_MULTIPLIER=2
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      keycloak:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  pacientes:
    build: ./microservice-pacientes
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - API_GATEWAY_URL=http://apigateway:8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  citas:
    build: ./microservice-citas
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - API_GATEWAY_URL=http://apigateway:8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  alertas:
    build: ./microservice-alertas
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=alertas-group
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - API_GATEWAY_URL=http://apigateway:8084
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s
    restart: unless-stopped

networks:
  hospital-net:

volumes:
  postgres_data:
  keycloak_data:
  kafka_data: