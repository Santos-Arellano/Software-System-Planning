services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    ports:
      - "8080:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_DB=dev-file
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - JAVA_OPTS=-Xms256m -Xmx512m
    command:
      - start-dev
      - --http-port=8080
      - --hostname-strict=false
      - --hostname=localhost
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 120s
      timeout: 60s
      retries: 10
      start_period: 300s

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hospital"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak-config:
    image: curlimages/curl:latest
    depends_on:
      keycloak:
        condition: service_healthy
    volumes:
      - ./keycloak:/config
    command: >
      sh -c '
        echo "Waiting for Keycloak to be ready..."
        sleep 10
        echo "Creating Hospital realm..."
        curl -X POST http://keycloak:8080/admin/realms \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $$(curl -d "client_id=admin-cli" -d "username=admin" -d "password=admin" -d "grant_type=password" "http://keycloak:8080/realms/master/protocol/openid-connect/token" | jq -r ".access_token")" \
          -d @/config/realm.json
        echo "Realm created successfully"
      '
    networks:
      - hospital-net

  apigateway:
    build: ./api-gateway
    ports:
      - "8084:8084"
    environment:
      - SERVER_PORT=8084
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_CLIENT_ID=hospital-client
      - SPRING_CLOUD_LOADBALANCER_RETRY_ENABLED=true
      - SPRING_CLOUD_LOADBALANCER_RETRY_MAX_RETRIES=5
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_INITIAL_INTERVAL=1000
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_MAX_INTERVAL=5000
      - SPRING_CLOUD_LOADBALANCER_RETRY_BACKOFF_MULTIPLIER=2
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8084/actuator/health || echo 'API Gateway still starting...'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: on-failure

  pacientes:
    build: ./microservice-pacientes
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - API_GATEWAY_URL=http://apigateway:8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8081/actuator/health || echo 'Still starting...'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: on-failure

  citas:
    build: ./microservice-citas
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - API_GATEWAY_URL=http://apigateway:8084
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8082/actuator/health || echo 'Still starting...'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: on-failure

  alertas:
    build: ./microservice-alertas
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hospital
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=alertas-group
      - SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET=earliest
      - API_GATEWAY_URL=http://apigateway:8084
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=hospital
      - KEYCLOAK_RESOURCE=hospital-client
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-config:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      apigateway:
        condition: service_healthy
    networks:
      - hospital-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8083/actuator/health || echo 'Still starting...'"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: on-failure

volumes:
  postgres_data:
  kafka_data:
  keycloak_data:

networks:
  hospital-net:
    driver: bridge